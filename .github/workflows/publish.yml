name: Publish

# Publishes @courthive/ingest-core to npm when a GitHub Release is published.
# Requires an NPM_TOKEN secret with publish rights to the @courthive scope.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # `version` intentionally omitted — pnpm/action-setup@v6 errors with
      # ERR_PNPM_BAD_PM_VERSION when both `version:` is set AND
      # `packageManager` is present in package.json. package.json stays the
      # single source of truth (matches pnpm v11's own expectation).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
