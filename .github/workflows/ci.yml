name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `version` intentionally omitted — pnpm/action-setup@v6 errors with
      # ERR_PNPM_BAD_PM_VERSION when both `version:` is set AND
      # `packageManager` is present in package.json. package.json stays the
      # single source of truth (matches pnpm v11's own expectation).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check-types
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
